x-tapir-environment: &tapir_environment
  VIRTUAL_HOST: localhost
  DEBUG: 1
  DJANGO_VITE_DEBUG: True
  KEYCLOAK_SKIP_VERIFICATION_EMAIL: False
  EMAIL_ENV: prod
  EMAIL_HOST: list.example.com
  EMAIL_PORT: 1025
  EMAIL_USE_SSL: False
  EMAIL_USE_TLS: False
  EMAIL_HOST_SENDER: tapir@example.com
  EMAIL_HOST_SENDER_NAME: Test Tapir
  EMAIL_HOST_USER: test
  EMAIL_HOST_PASSWORD: test
  EMAIL_BOUNCE_ADDRESS: tapir@example.com

services:
  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/themes:/opt/keycloak/themes
    environment:
      KC_HEALTH_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  web:
    build:
      context: .
      target: dev
    command: bash -c "poetry lock && poetry install &&
      poetry run python manage.py compilemessages --ignore \".venv\" &&
      poetry run python manage.py runserver_plus 0.0.0.0:8000 --reloader-type=stat"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          bash -c "{ printf 'GET / HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.1 [23][0-9][0-9]'; } 0<>/dev/tcp/localhost/8000"
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - .:/app
      - media-volume:/app/media
      # - web-static:/app/static
      # - web-uploads:/app/tapir/filepond_stored_uploads
    environment: *tapir_environment
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8000:8000"

  db:
    image: postgres:14
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --dbname tapir --username tapir" ]
      interval: 10s
      timeout: 5s
      retries: 30
    # volumes:
    #   - tapir-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tapir
      - POSTGRES_PASSWORD=tapir
      - POSTGRES_USER=tapir
    ports:
      - '5432:5432'

  # Backend for Celery task queue
  redis:
    image: redis:alpine
    ports:
      - '6379:6379'

  celery:
    build:
      context: .
      target: dev
    command: bash -c "poetry install &&
      poetry run celery -A tapir worker -l info --pool=solo"
    volumes:
      - .:/app
    environment: *tapir_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      target: dev
    # --schedule to avoid polluting the app directory
    command: bash -c "poetry install &&
      poetry run celery -A tapir beat -l info --schedule /tmp/celerybeat-schedule"
    volumes:
      - .:/app
    environment: *tapir_environment
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_healthy
  vite:
    build:
      context: .
      dockerfile: ./vite.Dockerfile
    tty: true
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - vite_node_modules:/app/node_modules

  # Local test mail server: captures all outgoing mail from Mailman
  # instead of delivering it, so nothing escapes to real inboxes.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # - MP_DATABASE=/db/mailpit.db
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
      - MP_SMTP_AUTH_ACCEPT_ANY=true
    # volumes:
    #   - mailpit-db:/db
    ports:
      - "8025:8025"  # Web UI - view captured messages at http://localhost:8025
      - "1025:1025"  # SMTP server - Mailman delivers here
    networks:
      default:
        aliases:
          - example.com
          - list.example.com

volumes:
  media-volume:
  # tapir-db:
  # web-static:
  # web-uploads:
  vite_node_modules:
  # mailpit-db:
