[tool.poetry]
name = "tapir"
version = "0.1.0"
description = ""
authors = ["Michael Kleimann <dev@mkleimann.com>", "Théophile Madet <theo.madet@posteo.net>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0.7"
django-extensions = "^4.1"
psycopg2-binary = "^2.9.12"
django-tables2 = "^3.0.0"
django-filter = "^26.1"
django-phonenumber-field = { version = "^5.2.0", extras = ["phonenumbers"] }
phonenumbers = "^9.0.30"
weasyprint = "^69.0"
django-select2 = "^8.4.8"
django-silk = "^5.5.0"
gunicorn = "^26.0.0"
django-environ = "^0.14.0"
django-bootstrap5 = "^26.2"
celery = "^5.6.3"
redis = "^8.1.0"
django-localflavor = "^5.0"
nanoid = "^2.0.0"
lxml = "^6.1.1"
python-keycloak = "^7.1.1"
unidecode = "^1.4.0"
tapir-mail = { url = "https://github.com/FoodCoopX/tapir-mail-releases/releases/download/0.0.0-dev-1785410618/tapir_mail-0.0.0.dev1785410618-py3-none-any.whl" }
djangorestframework = "^3.17.1"
drf-spectacular = "^0.30.0"
django-vite = "^3.1.0"
whitenoise = { extras = ["brotli"], version = "^6.12.0" }
django-allauth = { extras = ["socialaccount"], version = "^65.10.0" }
djhtml = "^3.0.11"
distinctipy = { extras = ["extras"], version = "^1.3.4" }
pre-commit = "^4.6.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.0"
Werkzeug = "^3.1.8"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-django = "^4.12.0"
pytest-sugar = "^1.1.1"
factory-boy = "^3.3.3"
black = "^26.5.1"
icecream = "^2.2.0"
ipython = "^9.15.0"
django-upgrade = "^1.31.1"
pytest-xdist = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/urls.py",
    "migrate.py"
]
relative_files = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tapir.settings"
python_files = ["tests.py", "test_*.py", "tests_*.py"]
testpaths = "tapir"