[tool.poetry]
name = "tapir"
version = "0.1.0"
description = ""
authors = ["Michael Kleimann <dev@mkleimann.com>", "Théophile Madet <theo.madet@posteo.net>"]
package-mode = false

[tool.poetry.dependencies]
python = "3.14.9"
django = "^6.0.7"
django-extensions = "^4.1"
psycopg2-binary = "^2.9.12"
django-tables2 = "^3.0.0"
django-filter = "^26.1"
django-phonenumber-field = { version = "^5.2.0", extras = ["phonenumbers"] }
phonenumbers = "^9.0.30"
weasyprint = "^70.0"
django-select2 = "^8.4.8"
gunicorn = "^26.0.0"
django-environ = "^0.14.0"
django-bootstrap5 = "^26.2"
celery = "^5.6.3"
redis = "^8.1.0"
django-localflavor = "^5.0"
nanoid = "^2.0.0"
lxml = "^6.1.1"
python-keycloak = "^7.1.1"
unidecode = "^1.4.0"
tapir-mail = { url = "https://github.com/FoodCoopX/tapir-mail-releases/releases/download/0.0.0-dev-1793288446/tapir_mail-0.0.0.dev1793288446-py3-none-any.whl" }
djangorestframework = "^3.17.1"
drf-spectacular = "^0.30.0"
django-vite = "^3.1.0"
whitenoise = "^6.12.0"
django-allauth = { extras = ["socialaccount"], version = "^65.10.0" }
distinctipy = { extras = ["extras"], version = "^1.3.4" }
requests = "^2.34.2"
mailmanclient = "^3.3.5"
ortools = { version = "^9.15.6755", optional = true }
jasmin-django-core = { url = "https://raw.githubusercontent.com/FoodCoopX/jasmin/929788fe00b440559b5ac82b8d53b9043b6ff244/jasmin_django_core-0.1.0-py3-none-any.whl" }
factory-boy = "^3.3.3"
icecream = "^2.2.0"
ipython = "^9.15.0"

[tool.poetry.extras]
bakery = ["ortools"]

[tool.poetry.group.dev.dependencies]
django-silk = "^5.5.0"
pre-commit = "^4.6.1"
Werkzeug = "^3.1.8"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-django = "^4.12.0"
pytest-sugar = "^1.1.1"
black = "^26.5.1"
django-upgrade = "^1.31.1"
pytest-xdist = "^3.8.0"
django-test-migrations = "^1.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/urls.py",
    "migrate.py"
]
relative_files = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tapir.settings"
testpaths = "tapir"
markers = ["slow: scheduled first to shorten parallel runs"]
# Migration tests are slow, run them with "make test-migrations". They also run in "make test".
addopts = "-m 'not migration_test'"