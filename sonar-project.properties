sonar.projectKey=FoodCoopX_wirgarten-tapir
sonar.organization=foodcoopx


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=tapir
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.python.version=3.14

sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/migrations/*, **/*.js, **/*.ts, manage.py, **/urls.py, **/*.tsx, tapir/utils/services/test_data_generation/**, scripts/**
sonar.cpd.exclusions=**/tests/**
sonar.exclusions=**/api-client/**, **/migrations/*.py, tapir/core/static/core/bootstrap/**, static/**, **/tests/**, tapir/wirgarten/static/wirgarten/css/leaflet.css

sonar.issue.ignore.multicriteria=themeImportant,testDataLiterals
sonar.issue.ignore.multicriteria.themeImportant.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.themeImportant.resourceKey=**/themes/**
sonar.issue.ignore.multicriteria.testDataLiterals.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.testDataLiterals.resourceKey=tapir/utils/services/test_data_generation/**
