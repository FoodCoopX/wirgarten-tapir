passwordResetBody=Es wurde eine \u00C4nderung der Anmeldeinformationen f\u00FCr deinen Account angefordert. Wenn du diese \u00C4nderung beantragt hast, klicke auf den folgenden Link:\n\n{0}\n\nDie G\u00FCltigkeit des Links wird in {1} Minuten verfallen.\n\nFalls du dein Passwort nicht zurücksetzen wolltest, kannst du diese Nachricht einfach ignorieren.
passwordResetBodyHtml=Es wurde eine \u00C4nderung der Anmeldeinformationen f\u00FCr deinen Account angefordert. Wenn du diese \u00C4nderung beantragt hast, klicke auf den folgenden Link:<br/><br/><a href="{0}">Link zum Zurücksetzen deines Passworts</a><br/><br/>Die G\u00FCltigkeit des Links wird in {1} Minuten verfallen.<br/><br/>Falls du dein Passwort nicht zurücksetzen wolltest, kannst du diese Nachricht einfach ignorieren.
executeActionsSubject=Bitte aktiviere dein Benutzerkonto für unseren Mitgliederbereich
executeActionsBody=Bitte aktiviere deinen Benutzeraccount für den Mitgliederbereich. Klicke dazu einfach auf diesen Link, um ein Passwort zu setzen und deine Mailadresse zu verifizieren. Anschließend wirst du automatisch in den Mitgliederbereich weitergeleitet.\n\n{0}\n\nAchtung: Dieser Link ist nur {1} Stunden  gültig. Wenn etwas nicht klappt, meld dich gerne bei uns unter SOLAWI_CONTACT_EMAIL
executeActionsBodyHtml=Bitte aktiviere deinen Benutzeraccount für den Mitgliederbereich. Klicke dazu einfach auf diesen Link, um ein Passwort zu setzen und deine Mailadresse zu verifizieren. Anschließend wirst du automatisch in den Mitgliederbereich weitergeleitet.<br/><br/><a href="{0}">Link zur Account-Aktivierung</a><br/><br/>Achtung: Dieser Link ist nur {1} Stunden  gültig. Wenn etwas nicht klappt, meld dich gerne bei uns unter <a href="mailto:SOLAWI_CONTACT_EMAIL">SOLAWI_CONTACT_EMAIL</a>

